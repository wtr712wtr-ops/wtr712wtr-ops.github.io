<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOWER｜AI作業の一元管理</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#080808">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=20261113-2115">
</head>
<body>
<header>
  <div class="hrow">
    <h1>TOWER</h1>
    <button id="keybtn" class="keybtn" title="編集キーの設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4.5"/><path d="M11.3 12.2 20 3.5"/><path d="M15.5 6.5 19 10"/></svg></button>
    <button id="bellbtn" class="keybtn" title="通知の設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg></button>
  </div>
</header>

<main>
  <div class="panel active" id="panel-today">
    <div class="phead">
      <h2 class="ptitle">今日</h2>
      <p id="meta" class="meta">読み込み中…</p>
    </div>

    <section id="today-progress" hidden>
      <div class="bar"><i id="today-bar-fill"></i></div>
      <p class="progress-note" id="today-bar-note"></p>
    </section>

    <section id="approvals-section" hidden>
      <h2>承認待ち</h2>
      <div id="approvals" class="stack"></div>
    </section>

    <section id="today-section">
      <h2>今日のタスク <span id="today-date" class="h2sub"></span></h2>
      <div id="today" class="stack"></div>
    </section>
  </div>

  <div class="panel" id="panel-media">
    <div class="phead">
      <h2 class="ptitle">媒体</h2>
    </div>

    <section>
      <div id="media" class="grid"></div>
    </section>
  </div>

  <div class="panel" id="panel-projects">
    <div class="phead">
      <h2 class="ptitle">案件</h2>
    </div>

    <section>
      <p class="sub legend"><span class="dot green"></span>運用中<span class="dot yellow"></span>進行中<span class="dot blue"></span>制作中<span class="dot red"></span>問題<span class="dot gray"></span>未着手</p>
      <div id="projects" class="grid"></div>
    </section>

    <section>
      <h2>工程の進み具合</h2>
      <div id="addwork"></div>
      <div id="works" class="stack"></div>
    </section>
  </div>

  <div class="panel" id="panel-numbers">
    <div class="phead">
      <h2 class="ptitle">数字</h2>
    </div>

    <section>
      <h2>数字とPDCA</h2>
      <div id="numbers" class="stack"></div>
    </section>
  </div>

  <div class="panel" id="panel-board">
    <div class="phead">
      <h2 class="ptitle">連携</h2>
    </div>

    <section>
      <h2>AIを開く</h2>
      <div class="launcher">
        <a class="btn lbtn" href="https://muse.ai/">Muse</a>
        <a class="btn lbtn" href="https://chatgpt.com/">GPT</a>
        <a class="btn lbtn" href="https://www.perplexity.ai/">Perplexity</a>
      </div>
      <p class="sub">ver. 20261113-2115</p>
    </section>

    <section>
      <h2>報告履歴</h2>
      <div id="reports" class="stack"></div>
    </section>

    <section>
      <h2>AI連携（依頼ボード）</h2>
      <div id="directive"></div>
      <div id="board" class="stack"></div>
    </section>

    <section>
      <h2>担当AI</h2>
      <div id="agents" class="grid"></div>
    </section>
  </div>

</main>

<nav id="tabs-bottom">
  <button class="tab active" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="tlabel">今日</span><span class="tbadge appr-badge" style="display:none"></span></button>
  <button class="tab" data-tab="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/></svg><span class="tlabel">媒体</span></button>
  <button class="tab" data-tab="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="tlabel">案件</span></button>
  <button class="tab" data-tab="numbers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span class="tlabel">数字</span></button>
  <button class="tab" data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.6-5.6l-1.7 1.7"/><path d="M14 10a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.6 5.6l1.7-1.7"/></svg><span class="tlabel">連携</span></button>
</nav>

<script src="config.js?v=20261109-1745"></script>
<script src="app.js?v=20261112-2335"></script>
</body>
</html>
