<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>司令塔｜AI作業の一元管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>司令塔</h1>
  <p id="meta" class="meta">読み込み中…</p>
  <p id="editbar" class="meta"></p>
</header>

<main>
  <section id="approvals-section" hidden>
    <h2>承認待ち</h2>
    <div id="approvals" class="stack"></div>
  </section>

  <section>
    <h2>媒体</h2>
    <div id="media" class="grid"></div>
  </section>

  <section>
    <h2>案件</h2>
    <p class="sub">色の意味：緑＝運用中、黄＝進行中（道半ば）、青＝制作中、赤＝停止・問題、灰＝未着手</p>
    <div id="projects" class="grid"></div>
  </section>

  <section>
    <h2>作業</h2>
    <div id="addwork"></div>
    <div id="works" class="stack"></div>
  </section>

  <section>
    <h2>数字とPDCA</h2>
    <div id="numbers" class="stack"></div>
  </section>

  <section>
    <h2>AI連携（依頼ボード）</h2>
    <div id="directive"></div>
    <div id="board" class="stack"></div>
  </section>

  <section>
    <h2>担当AI</h2>
    <div id="agents" class="grid"></div>
  </section>

  <section>
    <h2>報告履歴</h2>
    <div id="reports" class="stack"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
